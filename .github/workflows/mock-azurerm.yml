name: Mock azurerm validation

# Validate that every CAF-generated name for resources changed in this PR
# is accepted by the corresponding azurerm_* resource schema, using
# `terraform test` with `mock_provider azurerm`. No Azure credentials needed.
#
# Scope: diff-only on PRs (only resources changed in resourceDefinition.json).
# A full sweep runs weekly on schedule (replacing the former agentic
# "Weekly mock-azurerm sweep") and can be run manually via workflow_dispatch
# with `scope: all`.

on:
  pull_request:
    branches: [main]
    paths:
      - 'resourceDefinition.json'
      - 'azurecaf/**'
      - 'scripts/mock-test/**'
      - '.github/workflows/mock-azurerm.yml'
  schedule:
    - cron: "0 9 * * 1"  # Mondays at 9:00 UTC, full sweep
  workflow_dispatch:
    inputs:
      scope:
        description: 'Test scope'
        required: true
        default: 'changed'
        type: choice
        options: [changed, all]

permissions:
  contents: read

jobs:
  report-sweep-failure:
    name: Report weekly sweep failure
    needs: mock-azurerm
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update mock-azurerm issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[mock-azurerm] Weekly full sweep failed"
          body="Weekly full mock-azurerm sweep failed: ${RUN_URL} (see the mock-azurerm-report artifact)."
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label bug --label automated
          fi

  mock-azurerm:
    name: Mock azurerm validation (${{ (github.event_name == 'schedule' || github.event.inputs.scope == 'all') && 'all resources' || 'changed resources' }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # required so `git diff origin/main...HEAD` works

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.15"
          terraform_wrapper: false

      - name: Cache azurerm plugin downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-plugin-cache-${{ runner.os }}-azurerm-v4

      - name: Build provider
        run: make build
        env:
          CHECKPOINT_DISABLE: '1'

      - name: Ensure base ref is fetched
        run: git fetch --no-tags --depth=1 origin main

      - name: Run mock-azurerm validation
        env:
          CHECKPOINT_DISABLE: '1'
          TF_IN_AUTOMATION: '1'
          SCOPE: ${{ github.event_name == 'schedule' && 'all' || github.event.inputs.scope }}
        run: |
          if [[ "$SCOPE" == "all" ]]; then
            make test_mock_azurerm_all
          else
            make test_mock_azurerm_changed
          fi

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mock-azurerm-report
          path: |
            /tmp/azurecaf-mock/report.tsv
            /tmp/azurecaf-mock/logs/
          if-no-files-found: ignore
          retention-days: 14
