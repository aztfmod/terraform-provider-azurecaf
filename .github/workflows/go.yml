name: Go

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  repository_dispatch:
  # Nightly regression run on main (replaces the former agentic Nightly Regression workflow)
  schedule:
    - cron: "0 3 * * *"

# Restrict permissions for all jobs by default
permissions:
  contents: read

jobs:
  report-nightly-failure:
    name: Report nightly failure
    needs: build
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update nightly regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="[nightly-regression] Scheduled CI failed on main"
          body="Scheduled run failed: ${RUN_URL}"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label bug --label automated --label nightly
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
      id-token: write  # Required for keyless signing
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'

      - name: Install tfproviderlint
        run: |
          # v0.31.0
          go install github.com/bflad/tfproviderlint/cmd/tfproviderlint@fe5175f9de70aabcb649e78e53739d580bb7d66d
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.15"
          terraform_wrapper: false

      - name: Build
        run: go build -v ./...

      - name: Resource Definition Validation
        run: make test_resource_definitions
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Resource Matrix Testing
        run: make test_resource_matrix
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Resource Coverage Analysis
        run: make test_resource_coverage
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Unit Tests
        run: make unittest
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Test Coverage
        run: make test_coverage
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Test Coverage HTML
        run: make test_coverage_html
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Test Integration
        run: make test_integration
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Test Data Sources
        run: make test_data_sources
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Test Error Handling
        run: make test_error_handling
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Test Resource Naming
        run: make test_resource_naming
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Comprehensive CI Tests
        run: make test_ci
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: E2E Tests (Quick)
        run: make test_e2e_quick
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: E2E Tests (Full) - Pull Requests and Tags
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
        run: make test_e2e
        env:
          CHECKPOINT_DISABLE: 1
          TF_IN_AUTOMATION: 1
          TF_CLI_ARGS_init: "-upgrade=false"

      - name: Validate stable release metadata
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: ./scripts/check-release-ready.sh "$GITHUB_REF_NAME"

      - name: Select release notes
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          notes=".github/releases/${GITHUB_REF_NAME}.md"
          if [[ -s "$notes" ]]; then
            printf 'path=%s\n' "$notes" >> "$GITHUB_OUTPUT"
            printf 'args=release --clean --release-notes %s\n' "$notes" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Stable releases require non-empty committed release notes at $notes"
            exit 1
          else
            echo 'args=release --clean' >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          version: '~> v2'
          args: ${{ steps.release_notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Verify published release notes
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.path }}
        run: |
          set -euo pipefail
          expected=$(<"$RELEASE_NOTES_PATH")
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .body)

          if [[ "$actual" != "$expected" ]]; then
            echo "Published release notes differ from $RELEASE_NOTES_PATH; repairing."
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RELEASE_NOTES_PATH"
            actual=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .body)
          fi

          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Published release notes do not match $RELEASE_NOTES_PATH"
            exit 1
          fi
